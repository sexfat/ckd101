<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Job</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
    }

    /* Card */
    .card-job {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0px 0px 12px 0px rgba(255, 98, 0, 0.16);
      width: 280px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      overflow: hidden;
      width: 100%;
    }

    /* Logo area */
    .card-cover {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      padding: 16px 0 24px 0;
      width: 100%;
    }

    .logo {
      height: 60px;
      width: 179px;
      object-fit: contain;
      display: block;
    }

    /* Tags */
    .tags {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      overflow: hidden;
      width: 100%;
    }

    .tag {
      background: #f4f4f5;
      border: 1px solid #f2f5fc;
      border-radius: 4px;
      padding: 1px 10px;
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      line-height: 20px;
      color: #909399;
      white-space: nowrap;
    }

    /* Card title row */
    .card-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      overflow: hidden;
      width: 100%;
    }

    .card-title-text .company {
      font-family: Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      line-height: normal;
      color: #000000;
    }

    .card-title-text .position {
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: normal;
      color: #000000;
    }

    /* Save button */
    .btn-save {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .icon-button {
      background: #ffffff;
      border: 1px solid #dcdfe6;
      border-radius: 9999px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-button svg {
      width: 14px;
      height: 14px;
      color: #606266;
    }

    /* Info row */
    .info {
      display: flex;
      gap: 12px;
      align-items: center;
      overflow: hidden;
      width: 100%;
    }

    .info-text {
      font-family: Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      line-height: normal;
      color: #aeaeb2;
      white-space: nowrap;
    }

    .info-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #aeaeb2;
      flex-shrink: 0;
    }

    /* Salary */
    .salary {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      padding-top: 32px;
    }

    .salary-amount {
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 40px;
      line-height: normal;
      color: #000000;
    }

    .salary-unit {
      font-family: Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      line-height: normal;
      color: #000000;
    }

    /* Apply button */
    .btn-apply {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      overflow: hidden;
      width: 100%;
    }

    .btn-apply-inner {
      background: #409eff;
      border: none;
      border-radius: 4px;
      height: 32px;
      padding: 4px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-apply-inner span {
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 500;
      font-size: 14px;
      line-height: 22px;
      color: #ffffff;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="card-job">
    <div class="card-body">

      <!-- Logo -->
      <div class="card-cover">
        <img
          class="logo"
          src="https://www.figma.com/api/mcp/asset/87ef1b16-a8bd-478d-a032-1612c97b1075"
          alt="Amazon logo"
        />
      </div>

      <!-- Tags -->
      <div class="tags">
        <span class="tag">Senior level</span>
        <span class="tag">Part-time</span>
      </div>

      <!-- Title + Save button -->
      <div class="card-title">
        <div class="card-title-text">
          <p class="company">Amazon</p>
          <p class="position">Senior UI/UX Designer</p>
        </div>
        <div class="btn-save">
          <button class="icon-button" aria-label="Save job">
            <!-- Bookmark icon -->
            <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M2.625 2.1875C2.625 1.77329 2.96079 1.4375 3.375 1.4375H10.625C11.0392 1.4375 11.375 1.77329 11.375 2.1875V12.3125L7 9.625L2.625 12.3125V2.1875Z"
                stroke="#606266"
                stroke-width="1.2"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Info -->
      <div class="info">
        <span class="info-text">5 days ago</span>
        <span class="info-dot"></span>
        <span class="info-text">San Francisco, CA</span>
      </div>

      <!-- Salary -->
      <div class="salary">
        <p>
          <span class="salary-amount">$120</span><span class="salary-unit">/hr</span>
        </p>
      </div>

      <!-- Apply button -->
      <div class="btn-apply">
        <button class="btn-apply-inner">
          <span>Apply now</span>
        </button>
      </div>

    </div>
  </div>

</body>
</html>
